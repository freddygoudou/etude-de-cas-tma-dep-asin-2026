spring.application.name=inscriptions-concours

# schéma existant, passer sql/reparation.sql avant
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inscriptions}
spring.datasource.username=${DB_USER:inscriptions}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never

identite.url=${IDENTITE_URL:http://localhost:9090}
identite.delai=5s

spring.jackson.time-zone=UTC

# le schéma est géré par les scripts SQL, pas par Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
